# PipeWire-Pulse applies these node properties before WirePlumber links streams.
# Keep Equibop playback on Chat without changing input or share destinations.
stream.rules = [
    {
        matches = [
            { application.name = "~^[Ee]quibop$" media.class = "Stream/Output/Audio" }
        ]
        actions = { update-props = { target.object = "Sonar_Chat" } }
    }
    # Voice and screen-share captures share an application restore key.
    # Preserve each explicit source choice instead of restoring the previous capture.
    {
        matches = [
            { application.name = "~^[Ee]quibop$" media.class = "Stream/Input/Audio" }
        ]
        actions = { update-props = { state.restore-target = false state.restore-props = false } }
    }
    {
        matches = [
            { application.process.binary = "aces" application.name = "FMOD Audio" media.class = "Stream/Output/Audio" }
        ]
        actions = { update-props = { target.object = "Sonar_Game" } }
    }
    {
        matches = [
            { application.process.binary = "steam" media.class = "Stream/Input/Audio" stream.capture.sink = true }
        ]
        actions = { update-props = { target.object = "Sonar_Game" } }
    }
]
