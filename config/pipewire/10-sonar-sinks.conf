# Sonar-like virtual audio channels routed to Arctis Nova 7
# Uses filter-chain: each channel is a real sink that apps can target.
# All channels mix into the headset. Per-channel volume via pavucontrol-qt.

context.modules = [
  # Game channel → Arctis Nova 7
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Game"
      media.name       = "Game"
      filter.graph = {
        nodes = [
          {
            type    = builtin
            name    = passthrough
            label   = bq_highshelf
            control = { "Freq" = 22050.0 "Q" = 1.0 "Gain" = 0.0 }
          }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name     = "Sonar_Game"
        media.class   = Audio/Sink
        object.linger = true
      }
      playback.props = {
        node.name         = "Sonar_Game_out"
        target.object     = "alsa_output.usb-SteelSeries_Arctis_Nova_7-00.analog-stereo"
        stream.dont-remix = true
      }
    }
  }
