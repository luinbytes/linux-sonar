# Sonar Mixer — WirePlumber settings.
#
# ROUTING NOTE: stream.rules update-props with target.object only updates
# WirePlumber's local Lua state, it does NOT set routing metadata. Using it
# blocks state restoration without providing routing. Routing is instead
# handled by sonar-mixer via pactl move-sink-input, and WirePlumber persists
# those moves in its state file (~/.local/state/wireplumber/stream-properties).
#
# This file only sets the default output sink.

wireplumber.settings = {
  default-sink   = "Sonar_Game"
  default-source = "Sonar_Mic"
}

# Keep the Arctis Nova 7 from suspending between audio bursts (Discord VAD,
# game sound effects), which causes a pop on resume.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.usb-SteelSeries_Arctis_Nova_7-00.analog-stereo" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
